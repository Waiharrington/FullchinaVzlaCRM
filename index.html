<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Full China - Sistema Operativo de Food Truck" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Graduate&family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Graduate&family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" id="pwa-manifest" href="/manifest-admin.webmanifest" />
    <script>
      // Elige el manifest correcto en la primera carga: menú de clientes (/pedir)
      // instala la app "Full China"; el resto instala "Full China Admin".
      (function () {
        var link = document.getElementById('pwa-manifest');
        if (link && location.pathname.toLowerCase().indexOf('/pedir') === 0) {
          link.setAttribute('href', '/manifest-cliente.webmanifest');
        }
      })();
    </script>
    <link rel="preload" as="image" href="/optimized/root/logo.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/optimized/previews/fondos/onboarding-bg-phone.webp" type="image/webp" fetchpriority="high" media="(max-width: 1279px)" />
    <link rel="preload" as="image" href="/optimized/previews/fondos/onboarding-bg-desktop.webp" type="image/webp" fetchpriority="high" media="(min-width: 1280px)" />
    <link rel="preload" as="image" href="/optimized/fondos/fondo-pagina-carga.webp" type="image/webp" fetchpriority="high" />
    <title>Full China</title>
    <style>
      .fc-loading {
          position: fixed; inset: 0; z-index: 99999;
          background: #0A0B0E;
          display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
          padding-top: 25vh; font-family: 'Outfit', sans-serif;
          overflow: hidden;
        }
        .fc-loading-bg {
          position: absolute; inset: -10%; z-index: 0;
          background: url('/optimized/fondos/fondo-pagina-carga.webp') center/cover no-repeat;
          animation: fcKenBurns 20s ease-out forwards, fcFocus 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          will-change: transform, filter;
        }
        .fc-loading-vignette {
          position: absolute; inset: 0; z-index: 1;
          background: radial-gradient(circle at center, transparent 20%, rgba(10,11,14,0.95) 100%);
          animation: fcVignetteBreathe 6s ease-in-out infinite alternate;
          pointer-events: none;
        }
        .fc-loading-logo, .fc-sticks, .fc-plate, .fc-loading-text {
          z-index: 2; position: relative;
        }
        @keyframes fcKenBurns {
          0% { transform: scale(1); }
          100% { transform: scale(1.15) translate(-1%, -1%); }
        }
        @keyframes fcFocus {
          0% { filter: blur(15px) brightness(0.2); }
          100% { filter: blur(0px) brightness(1); }
        }
        @keyframes fcVignetteBreathe {
          0% { opacity: 0.6; }
          100% { opacity: 1; }
        }
      .fc-loading-logo {
        width: clamp(200px, 48vw, 320px); height: auto;
        opacity: 0; transform: scale(0.6) translateY(20px);
        animation: fcLogoIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards, fcLogoFloat 4s ease-in-out 1.1s infinite;
        filter: drop-shadow(0 8px 40px rgba(227,27,43,0.8));
      }
      @keyframes fcLogoIn { to { opacity: 1; transform: scale(1) translateY(0); } }
      @keyframes fcLogoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      
      .fc-sticks {
        position: relative; width: 100px; height: 120px; margin-top: 8vh;
      }
      .fc-stick {
        position: absolute; width: 6px; height: 90px; border-radius: 4px;
        top: -150px; opacity: 0; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      }
      .fc-stick-l {
        left: 28px; background: linear-gradient(180deg, #D69762, #9E5630);
        transform: rotate(-20deg);
        animation: fcStickL 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
      }
      .fc-stick-r {
        right: 28px; background: linear-gradient(180deg, #D69762, #9E5630);
        transform: rotate(20deg);
        animation: fcStickR 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.65s forwards;
      }
      @keyframes fcStickL { 0% { top: -150px; opacity: 0; transform: rotate(-30deg); } 100% { top: 10px; opacity: 1; transform: rotate(-12deg); } }
      @keyframes fcStickR { 0% { top: -150px; opacity: 0; transform: rotate(30deg); } 100% { top: 10px; opacity: 1; transform: rotate(12deg); } }
      
      .fc-plate {
        position: relative;
        width: 120px; height: 28px;
        border: 4px solid #FF5528; border-top: none; border-radius: 0 0 60px 60px;
        margin-top: -15px; opacity: 0;
        box-shadow: 0 10px 20px rgba(255, 85, 40, 0.5), inset 0 5px 15px rgba(255, 85, 40, 0.4);
        animation: fcPlateIn 0.6s ease 1s forwards, fcPlatePulse 2s ease-in-out 1.6s infinite;
      }
      @keyframes fcPlateIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes fcPlatePulse { 0%, 100% { box-shadow: 0 10px 20px rgba(255, 85, 40, 0.5), inset 0 5px 15px rgba(255, 85, 40, 0.4); border-color: #FF5528; } 50% { box-shadow: 0 10px 30px rgba(255, 85, 40, 0.8), inset 0 5px 25px rgba(255, 85, 40, 0.6); border-color: #FF7740; } }
      
      .fc-loading-text {
        margin-top: 40px; font-size: 18px; font-weight: 700; letter-spacing: 0.05em;
        opacity: 0; 
        background: linear-gradient(90deg, #FFFFFF, #FFD666, #FFFFFF);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fcTextIn 0.5s ease 1.3s forwards, fcTextShimmer 2s linear 1.8s infinite;
      }
      @keyframes fcTextIn { from { transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fcTextShimmer { to { background-position: 200% center; } }
  @media (min-width: 1025px), (orientation: landscape) {
    .fc-loading-bg { background: url('/optimized/fondos/compu-onboarding-fondo.webp') left center/cover no-repeat; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .fc-loading { padding-top: 0; justify-content: center; }
    .fc-loading-logo { width: 140px; }
    .fc-sticks { transform: scale(0.7); margin-top: 0; }
    .fc-plate { transform: scale(0.7); margin-top: -25px; }
    .fc-loading-text { margin-top: 15px; font-size: 15px; }
  }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
