plugins {
    id 'com.android.application'
}

def releaseKeyPath = System.getenv('FULLCHINA_KEYSTORE_PATH')
def releaseKeyPassword = System.getenv('FULLCHINA_KEYSTORE_PASSWORD')

android {
    namespace 'com.fullchinavzla.tablet'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fullchinavzla.tablet'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseKeyPath && releaseKeyPassword) {
                storeFile file(releaseKeyPath)
                storePassword releaseKeyPassword
                keyAlias 'fullchina-tablet'
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
